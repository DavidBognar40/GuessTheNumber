<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlenraten – Rate die Zahl von 1 bis 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#170f2e; --panel:#241a47; --line:#4a3b88; --ink:#f5f0ff; --mute:#a99dd1;
  --yellow:#ffd23f; --hot:#ff4f7b; --ok:#3ef2b0;
  --px:'Press Start 2P',ui-monospace,monospace; --ui:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  min-height:100dvh; color:var(--ink); font-family:var(--ui);
  background:
    radial-gradient(ellipse at 50% 35%, #2b1d5c 0%, transparent 60%),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/32px 32px,
    var(--bg);
  display:flex; flex-direction:column; align-items:center; overflow-x:hidden;
}

/* Highscore oben links */
.hud{position:fixed; top:20px; left:20px; display:grid; gap:14px; z-index:5}
.hud-block{
  background:var(--panel); padding:14px 18px; min-width:210px;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line);
}
.hud-label{display:block; font-family:var(--px); font-size:10px; color:var(--mute); margin-bottom:10px}
.hud-block strong{display:block; font-family:var(--px); font-size:28px; color:var(--yellow); line-height:1}
.hud-block:nth-child(2) strong{color:var(--ink)}
.hud-block:nth-child(2).hot strong{color:var(--hot)}
.hud-sub{display:block; font-size:13px; color:var(--mute); margin-top:10px}

main{width:100%; max-width:760px; padding:28px 20px 40px; display:flex; flex-direction:column; align-items:center; flex:1}
header{text-align:center; margin-bottom:20px}
h1{font-family:var(--px); font-size:clamp(24px,5.4vw,44px); color:var(--yellow); text-shadow:4px 4px 0 var(--hot); letter-spacing:1px}
header p{margin-top:18px; color:var(--mute); font-size:16px}

/* Emoji + Sprechblase */
.stage{display:flex; flex-direction:column; align-items:center; margin:10px 0 4px}
.bubble{
  position:relative; background:var(--ink); color:#1c1038; font-family:var(--px); font-size:12px; line-height:1.7;
  padding:16px 20px; width:min(560px,86vw); min-height:76px; text-align:center; display:grid; place-items:center;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);
  margin-bottom:36px;
}
.bubble::before,.bubble::after{content:''; position:absolute; left:50%; background:var(--ink)}
.bubble::before{top:calc(100% + 4px); width:24px; height:8px; margin-left:-12px}
.bubble::after{top:calc(100% + 12px); width:8px; height:8px; margin-left:-4px}
.face{width:clamp(150px,26vw,230px); aspect-ratio:1; image-rendering:pixelated; filter:drop-shadow(0 14px 0 rgba(0,0,0,.28))}

.verdict{font-family:var(--px); font-size:clamp(16px,3.4vw,24px); min-height:36px; margin:22px 0 6px}
.verdict.ok{color:var(--ok); text-shadow:3px 3px 0 #0b4a37}
.verdict.no{color:var(--hot); text-shadow:3px 3px 0 #5a1530}

/* Skala wie ein Koordinatensystem */
.axis{
  position:relative; width:100%; display:grid; grid-template-columns:repeat(10,1fr);
  gap:clamp(3px,1.1vw,12px); padding:84px 10px 0;
}
.axis::after{content:''; position:absolute; left:0; right:-4px; bottom:8px; height:4px; background:var(--line)}
.axis::before{content:''; position:absolute; right:-4px; bottom:2px; width:0; height:0; z-index:2;
  border-left:14px solid var(--line); border-top:8px solid transparent; border-bottom:8px solid transparent}
.slot{
  position:relative; background:none; border:0; padding:0; font:inherit; color:inherit; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; outline:none; -webkit-tap-highlight-color:transparent;
}
.slot::before{content:''; position:absolute; left:50%; bottom:0; width:2px; height:100%; margin-left:-1px;
  background:repeating-linear-gradient(to top,var(--line) 0 4px,transparent 4px 9px); opacity:.55; transition:opacity .15s}
.tick{width:4px; height:20px; background:var(--line); margin-top:12px; position:relative; z-index:1}
.tile{
  --c:var(--line); --glow:0 0 0 0 transparent;
  position:relative; z-index:1; width:100%; aspect-ratio:3/4; display:grid; place-items:center;
  background:var(--panel); color:var(--ink); font-family:var(--px); font-size:clamp(10px,2.6vw,20px);
  box-shadow:0 -4px 0 0 var(--c),0 4px 0 0 var(--c),-4px 0 0 0 var(--c),4px 0 0 0 var(--c),var(--glow);
  transform:translateY(var(--y,0px)) scale(var(--s,1)); transform-origin:50% 100%;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.2),background .12s,color .12s;
}
.slot:not(:disabled):hover .tile,.slot:focus-visible .tile{
  --c:var(--yellow); --glow:0 0 32px 6px rgba(255,210,63,.55);
  background:var(--yellow); color:#2a1500;
}
.slot:not(:disabled):hover::before,.slot:focus-visible::before{opacity:1; background:repeating-linear-gradient(to top,var(--yellow) 0 4px,transparent 4px 9px)}
.axis.busy .slot{cursor:default}
.slot.locked .tile{--c:#fff; background:#fff; color:#2a1500}
.slot.win .tile{--c:#fff; background:var(--ok); color:#00281a; --glow:0 0 40px 10px rgba(62,242,176,.6)}
.slot.dead{cursor:not-allowed}
.slot.dead .tile{--c:#5a2a62; background:#1d1238; color:var(--hot); opacity:.55}
.slot.dead::before{opacity:.15}

#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50}

@media (max-width:900px){
  .hud{position:static; grid-auto-flow:column; width:100%; padding:16px 20px 0; gap:16px}
  .hud-block{min-width:0}
  .hud-block strong{font-size:22px}
}
</style>
</head>
<body>

<aside class="hud" aria-label="Spielstand">
  <div class="hud-block" id="bestBlock">
    <span class="hud-label">Highscore</span>
    <strong id="best">0</strong>
    <span class="hud-sub">meiste Fehlversuche in Folge</span>
  </div>
  <div class="hud-block" id="streakBlock">
    <span class="hud-label">Aktuelle Serie</span>
    <strong id="streak">0</strong>
    <span class="hud-sub">Fehlversuche in dieser Runde</span>
  </div>
</aside>

<main>
  <header>
    <h1>Zahlenraten</h1>
    <p>Ich denke an eine Zahl von 1 bis 10. Wähle sie auf der Skala.</p>
  </header>

  <section class="stage">
    <div class="bubble" aria-live="polite"><span id="say"></span></div>
    <canvas id="face" class="face" width="16" height="16" role="img" aria-label="Pixel-Emoji, das dich auslacht"></canvas>
  </section>

  <p class="verdict" id="verdict" aria-live="assertive"></p>

  <section class="axis" id="axis" aria-label="Zahlenskala von 1 bis 10"></section>
</main>

<canvas id="fx"></canvas>

<script src="animation.js"></script>
<script src="function.js"></script>
</body>
</html>
